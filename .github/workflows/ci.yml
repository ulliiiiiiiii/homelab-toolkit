name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: shellcheck ssh/*.sh network/*.sh clipboard/*.sh desktop/*.sh
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
